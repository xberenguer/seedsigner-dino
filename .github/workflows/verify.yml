name: Verify source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check public source inventory
        run: python tools/audit_public_tree.py
      - name: Run Python regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest tests -q -p no:cacheprovider
      - name: Run native frontend tests
        run: make -C native test

